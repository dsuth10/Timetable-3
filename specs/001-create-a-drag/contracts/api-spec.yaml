openapi: 3.0.3
info:
  title: Teacher Aide Scheduler API
  version: 1.0.0
  description: REST API for drag-and-drop timetable scheduling system
  
servers:
  - url: http://localhost:5000/api
    description: Local development server

paths:
  # Teacher Aides
  /aides:
    get:
      summary: List all teacher aides
      tags: [Teacher Aides]
      responses:
        '200':
          description: List of teacher aides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeacherAide'
    post:
      summary: Create a new teacher aide
      tags: [Teacher Aides]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, colour_hex]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                qualifications:
                  type: string
                colour_hex:
                  type: string
                  pattern: '^#[0-9A-Fa-f]{6}$'
      responses:
        '201':
          description: Aide created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherAide'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /aides/{id}:
    get:
      summary: Get aide by ID
      tags: [Teacher Aides]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Aide details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherAide'
        '404':
          description: Aide not found
    put:
      summary: Update aide
      tags: [Teacher Aides]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                qualifications:
                  type: string
                colour_hex:
                  type: string
      responses:
        '200':
          description: Aide updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherAide'
    delete:
      summary: Delete aide
      tags: [Teacher Aides]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Aide deleted
        '404':
          description: Aide not found
  
  # Availability
  /aides/{id}/availability:
    get:
      summary: Get aide's weekly availability
      tags: [Availability]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Availability patterns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Availability'
    post:
      summary: Add availability slot
      tags: [Availability]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weekday, start_time, end_time]
              properties:
                weekday:
                  type: string
                  enum: [MO, TU, WE, TH, FR]
                start_time:
                  type: string
                  pattern: '^([0-1][0-9]|2[0-3]):[03]0$'
                end_time:
                  type: string
                  pattern: '^([0-1][0-9]|2[0-3]):[03]0$'
      responses:
        '201':
          description: Availability added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '409':
          description: Duplicate availability slot
  
  # Tasks
  /tasks:
    get:
      summary: List tasks
      tags: [Tasks]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [UNASSIGNED, ASSIGNED, IN_PROGRESS, COMPLETE]
        - name: category
          in: query
          schema:
            type: string
            enum: [PLAYGROUND, CLASS_SUPPORT, GROUP_SUPPORT, INDIVIDUAL_SUPPORT]
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      summary: Create one-off task
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  
  /recurring-tasks:
    post:
      summary: Create recurring task with RRULE
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/TaskCreate'
                - type: object
                  required: [recurrence_rule, expires_on]
                  properties:
                    recurrence_rule:
                      type: string
                      example: "FREQ=WEEKLY;BYDAY=MO,WE,FR"
                    expires_on:
                      type: string
                      format: date
      responses:
        '201':
          description: Recurring task created with assignments generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: '#/components/schemas/Task'
                  assignments_created:
                    type: integer
  
  /tasks/{id}:
    get:
      summary: Get task by ID
      tags: [Tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
    put:
      summary: Update task (regenerates future assignments if recurring)
      tags: [Tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                category:
                  type: string
                start_time:
                  type: string
                end_time:
                  type: string
                notes:
                  type: string
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: '#/components/schemas/Task'
                  assignments_updated:
                    type: integer
    delete:
      summary: Delete task (future occurrences only)
      tags: [Tasks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Task deleted
  
  # Assignments
  /assignments:
    get:
      summary: List assignments
      tags: [Assignments]
      parameters:
        - name: week
          in: query
          schema:
            type: string
            pattern: '^\d{4}-W\d{2}$'
            example: "2025-W01"
        - name: aide_id
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [UNASSIGNED, ASSIGNED, IN_PROGRESS, COMPLETE]
      responses:
        '200':
          description: List of assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Assignment'
    post:
      summary: Create single assignment
      tags: [Assignments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentCreate'
      responses:
        '201':
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '409':
          description: Conflict detected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
  
  /assignments/weekly-matrix:
    get:
      summary: Get structured weekly matrix for UI
      tags: [Assignments]
      parameters:
        - name: week
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-W\d{2}$'
            example: "2025-W01"
      responses:
        '200':
          description: Weekly matrix data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyMatrix'
  
  /assignments/batch:
    post:
      summary: Batch create assignments (recurring task multi-day)
      tags: [Assignments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, aide_id, dates]
              properties:
                task_id:
                  type: integer
                aide_id:
                  type: integer
                dates:
                  type: array
                  items:
                    type: string
                    format: date
      responses:
        '201':
          description: Assignments created
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Assignment'
                  conflicts:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConflictError'
  
  /assignments/check:
    post:
      summary: Check for conflicts (dry-run)
      tags: [Assignments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentCreate'
      responses:
        '200':
          description: No conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  conflict:
                    type: boolean
                    example: false
        '409':
          description: Conflict detected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
  
  /assignments/{id}:
    get:
      summary: Get assignment by ID
      tags: [Assignments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Assignment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
    put:
      summary: Update assignment (with version check for optimistic locking)
      tags: [Assignments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                aide_id:
                  type: integer
                  nullable: true
                start_time:
                  type: string
                end_time:
                  type: string
                status:
                  type: string
                  enum: [UNASSIGNED, ASSIGNED, IN_PROGRESS, COMPLETE]
                version:
                  type: string
                  format: date-time
                  description: Client's version timestamp for optimistic locking
      responses:
        '200':
          description: Assignment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '409':
          description: Conflict (version mismatch or time collision)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
    delete:
      summary: Delete assignment
      tags: [Assignments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Assignment deleted
  
  # Absences
  /absences:
    get:
      summary: List absences (with optional week filter)
      tags: [Absences]
      parameters:
        - name: week
          in: query
          schema:
            type: string
            pattern: '^\d{4}-W\d{2}$'
            example: "2025-W01"
      responses:
        '200':
          description: List of absences
          content:
            application/json:
              schema:
                type: object
                properties:
                  absences:
                    type: array
                    items:
                      $ref: '#/components/schemas/Absence'
    post:
      summary: Mark aide absent (releases assignments)
      tags: [Absences]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aide_id, date]
              properties:
                aide_id:
                  type: integer
                date:
                  type: string
                  format: date
                reason:
                  type: string
      responses:
        '201':
          description: Absence created
          content:
            application/json:
              schema:
                type: object
                properties:
                  absence:
                    $ref: '#/components/schemas/Absence'
                  affected_assignments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Assignment'
        '409':
          description: Duplicate absence
  
  /absences/{id}:
    delete:
      summary: Remove absence (restore assignments if possible)
      tags: [Absences]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Absence removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  restored_assignments:
                    type: array
                    items:
                      type: integer
                  conflicts:
                    type: array
                    items:
                      type: integer
  
  # Teacher Requests
  /requests:
    get:
      summary: List teacher requests
      tags: [Requests]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
      responses:
        '200':
          description: List of requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Request'
    post:
      summary: Submit teacher request
      tags: [Requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requesting_teacher, task_title, task_category, preferred_date, preferred_time]
              properties:
                requesting_teacher:
                  type: string
                task_title:
                  type: string
                task_category:
                  type: string
                  enum: [PLAYGROUND, CLASS_SUPPORT, GROUP_SUPPORT, INDIVIDUAL_SUPPORT]
                preferred_date:
                  type: string
                  format: date
                preferred_time:
                  type: string
                classroom_id:
                  type: integer
                  nullable: true
                notes:
                  type: string
      responses:
        '201':
          description: Request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
  
  /requests/{id}:
    put:
      summary: Update request status (APPROVED creates task)
      tags: [Requests]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [APPROVED, REJECTED]
      responses:
        '200':
          description: Request updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    $ref: '#/components/schemas/Request'
                  task_created:
                    $ref: '#/components/schemas/Task'

components:
  schemas:
    TeacherAide:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        qualifications:
          type: string
        colour_hex:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    
    Availability:
      type: object
      properties:
        id:
          type: integer
        aide_id:
          type: integer
        weekday:
          type: string
          enum: [MO, TU, WE, TH, FR]
        start_time:
          type: string
        end_time:
          type: string
    
    Task:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        category:
          type: string
          enum: [PLAYGROUND, CLASS_SUPPORT, GROUP_SUPPORT, INDIVIDUAL_SUPPORT]
        start_time:
          type: string
        end_time:
          type: string
        recurrence_rule:
          type: string
          nullable: true
        expires_on:
          type: string
          format: date
          nullable: true
        classroom_id:
          type: integer
          nullable: true
        notes:
          type: string
        status:
          type: string
          enum: [UNASSIGNED, ASSIGNED, IN_PROGRESS, COMPLETE]
        created_at:
          type: string
          format: date-time
    
    TaskCreate:
      type: object
      required: [title, category, start_time, end_time]
      properties:
        title:
          type: string
        category:
          type: string
          enum: [PLAYGROUND, CLASS_SUPPORT, GROUP_SUPPORT, INDIVIDUAL_SUPPORT]
        start_time:
          type: string
        end_time:
          type: string
        classroom_id:
          type: integer
        notes:
          type: string
    
    Assignment:
      type: object
      properties:
        id:
          type: integer
        task_id:
          type: integer
        aide_id:
          type: integer
          nullable: true
        date:
          type: string
          format: date
        start_time:
          type: string
        end_time:
          type: string
        status:
          type: string
          enum: [UNASSIGNED, ASSIGNED, IN_PROGRESS, COMPLETE]
        version:
          type: string
          format: date-time
        task_title:
          type: string
        task_category:
          type: string
        classroom:
          type: string
          nullable: true
    
    AssignmentCreate:
      type: object
      required: [task_id, date, start_time, end_time]
      properties:
        task_id:
          type: integer
        aide_id:
          type: integer
          nullable: true
        date:
          type: string
          format: date
        start_time:
          type: string
        end_time:
          type: string
    
    Absence:
      type: object
      properties:
        id:
          type: integer
        aide_id:
          type: integer
        date:
          type: string
          format: date
        reason:
          type: string
        created_at:
          type: string
          format: date-time
    
    Request:
      type: object
      properties:
        id:
          type: integer
        requesting_teacher:
          type: string
        task_title:
          type: string
        task_category:
          type: string
        preferred_date:
          type: string
          format: date
        preferred_time:
          type: string
        classroom_id:
          type: integer
          nullable: true
        notes:
          type: string
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        created_at:
          type: string
          format: date-time
    
    WeeklyMatrix:
      type: object
      properties:
        week:
          type: string
          example: "2025-W01"
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        time_slots:
          type: array
          items:
            type: string
          example: ["08:00", "08:30", "09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "12:00", "12:30", "13:00", "13:30", "14:00", "14:30", "15:00", "15:30"]
        days:
          type: array
          items:
            type: string
          example: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]
        aides:
          type: array
          items:
            $ref: '#/components/schemas/TeacherAide'
        assignments:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Assignment'
          example:
            "1_Monday_09:00":
              assignment_id: 123
              task_id: 456
              task_title: "Morning Playground Duty"
              task_category: "PLAYGROUND"
              start_time: "09:00"
              end_time: "10:00"
              status: "ASSIGNED"
        absences:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Absence'
          example:
            "1_Monday":
              absence_id: 789
              reason: "Sick leave"
              date: "2025-01-06"
    
    ConflictError:
      type: object
      properties:
        error:
          type: string
          example: "Assignment conflict"
        conflict_type:
          type: string
          enum: [time_collision, version_mismatch, partial_overlap]
        conflicting_assignment:
          type: object
          properties:
            id:
              type: integer
            task_title:
              type: string
            start_time:
              type: string
            end_time:
              type: string
            aide_name:
              type: string
        suggestion:
          type: string
          enum: [replace, shorten_first, cancel]
        current_version:
          type: string
          format: date-time
    
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string



