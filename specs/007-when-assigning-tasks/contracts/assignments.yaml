openapi: 3.0.0
info:
  title: Assignment API
  version: 1.0.0
paths:
  /assignments:
    post:
      summary: Create a new assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - task_id
                - date
                - start_time
                - end_time
              properties:
                task_id:
                  type: integer
                aide_id:
                  type: integer
                  nullable: true
                date:
                  type: string
                  format: date
                start_time:
                  type: string
                  pattern: '^([01]\d|2[0-3]):([0-5]\d):([0-5]\d)$'
                end_time:
                  type: string
                  pattern: '^([01]\d|2[0-3]):([0-5]\d):([0-5]\d)$'
                status:
                  type: string
                  enum: [UNASSIGNED, ASSIGNED, IN_PROGRESS, COMPLETE]
      responses:
        '201':
          description: Created
        '409':
          description: Conflict detected

