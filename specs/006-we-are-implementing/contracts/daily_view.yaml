openapi: 3.0.0
info:
  title: Daily View API
  version: 1.0.0
paths:
  /api/daily-view/{date}:
    get:
      summary: Get all data needed for the Daily Display page
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: A structured object containing aides, assignments, and absences
          content:
            application/json:
              schema:
                type: object
                properties:
                  aides:
                    type: array
                    items:
                      $ref: '#/components/schemas/AideWithStatus'
                  relief_pool:
                    type: array
                    items:
                      $ref: '#/components/schemas/Assignment'
                  task_bank:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskTemplate'
                  timeline_config:
                    $ref: '#/components/schemas/TimelineConfig'

  /api/daily-view/assign:
    post:
      summary: Create or update an assignment via drag-and-drop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, date, aide_id, start_time, end_time]
              properties:
                type:
                  type: string
                  enum: [FROM_BANK, FROM_RELIEF]
                id:
                  type: integer
                  description: Task ID if FROM_BANK, Assignment ID if FROM_RELIEF
                date:
                  type: string
                  format: date
                aide_id:
                  type: integer
                start_time:
                  type: string
                  format: time
                end_time:
                  type: string
                  format: time
      responses:
        '201':
          description: Assignment successful
        '409':
          description: Collision detected

components:
  schemas:
    AideWithStatus:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        colour_hex: {type: string}
        is_absent: {type: boolean}
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
    
    Assignment:
      type: object
      properties:
        id: {type: integer}
        task_id: {type: integer}
        title: {type: string}
        category: {type: string}
        start_time: {type: string}
        end_time: {type: string}
        status: {type: string}

    TaskTemplate:
      type: object
      properties:
        id: {type: integer}
        title: {type: string}
        category: {type: string}

    TimelineConfig:
      type: object
      properties:
        slots:
          type: array
          items:
            type: object
            properties:
              start_time: {type: string}
              duration_minutes: {type: integer}


